<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薬局計算サイト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --accent: #1a6eb5;
    --accent-light: #e8f1fb;
    --accent2: #0d9488;
    --surface: #ffffff;
    --border: #dde3ea;
    --text: #1e293b;
    --text-muted: #64748b;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--accent);
    color: white;
    padding: 20px 24px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 16px rgba(26,110,181,0.18);
  }

  header .logo {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  header h1 { font-size: 18px; font-weight: 700; }
  header p  { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 20px;
    gap: 20px;
  }

  .lead {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.8;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 480px;
  }

  .nav-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    cursor: pointer;
  }

  .nav-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
  }

  .nav-card.card2:hover { border-color: var(--accent2); }

  .nav-card-icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }

  .card1 .nav-card-icon { background: var(--accent-light); }
  .card2 .nav-card-icon { background: #e6faf8; }

  .nav-card-body { flex: 1; }

  .nav-card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .card1 .nav-card-title { color: var(--accent); }
  .card2 .nav-card-title { color: var(--accent2); }

  .nav-card-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .nav-card-arrow {
    font-size: 20px;
    color: var(--border);
    flex-shrink: 0;
  }

  .card1:hover .nav-card-arrow { color: var(--accent); }
  .card2:hover .nav-card-arrow { color: var(--accent2); }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">💊</div>
  <div>
    <h1>薬局計算サイト</h1>
    <p>計算の種類を選んでください</p>
  </div>
</header>

<div class="container">
  <p class="lead">ご利用になる計算の種類を<br>下からお選びください。</p>

  <div class="cards">
    <a href="calc1.html" class="nav-card card1">
      <div class="nav-card-icon">🧮</div>
      <div class="nav-card-body">
        <div class="nav-card-title">調剤合計シミュレーション</div>
        <div class="nav-card-desc">用法・日数から薬の合計量と金額、<br>調剤料・カプセル代まで計算します。</div>
      </div>
      <div class="nav-card-arrow">›</div>
    </a>

    <a href="calc2.html" class="nav-card card2">
      <div class="nav-card-icon">💰</div>
      <div class="nav-card-body">
        <div class="nav-card-title">薬剤料のみ計算</div>
        <div class="nav-card-desc">全量を直接入力して<br>薬剤販売価格のみを計算します。</div>
      </div>
      <div class="nav-card-arrow">›</div>
    </a>
  </div>
</div>

<footer>© 薬局計算サイト</footer>

</body>
</html>
